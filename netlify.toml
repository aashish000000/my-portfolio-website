[build]
  publish = "public"
  command = "echo 'Static frontend — no build step'"

# Contact API is Express-only; on Netlify use static projects.json.
# Do not catch-all rewrite to index.html (breaks assets/PDFs).

[[headers]]
  for = "/projects.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
